<section class="container mx-auto my-3">
  <h2 class="text-3xl font-bold mb-2">Casas</h2>
  <h3 class="text-xl text-gray-400 mb-2 "></h3>
</section>
<section class="container mx-auto grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2">
  @for (house of houses(); track house.id) {
    <div class="card bg-base-100 shadow-sm">

      <app-minimap [lngLat]="house.lngLat" />

      <div class="card-body">
        <h2 class="card-title">
          {{ house.name }}
        <div class="badge badge-secondary">{{ house.price }}</div>
      </h2>
      <p>{{  house.description}}</p>
      <div class="card-actions justify-end">
        @for (tag of house.tags; track $index) {
          <div class="badge badge-outline">{{ tag }}</div>
        }
      </div>
    </div>
  </div>
}
</section>
